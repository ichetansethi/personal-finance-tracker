# Isolated H2 database so repository and full-context tests do not need PostgreSQL.
spring.datasource.url=jdbc:h2:mem:finance_tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

jwt.secret=0123456789abcdef0123456789abcdef
otp.enabled=false
otp.expiry.minutes=5
otp.length=6

spring.mail.host=localhost
spring.mail.port=2525
app.email.from=test@example.com

spring.sql.init.mode=never
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.chetan=INFO
